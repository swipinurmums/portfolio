<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Aron Belle modelling portfolio" />
  <meta name="theme-color" content="#f3f1ec" />
  <title>Aron Belle</title>

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/animations.css" />
</head>
<body>
  <div class="loader" aria-hidden="true">
    <span>AB</span>
  </div>

  <div class="grain" aria-hidden="true"></div>

  <header class="site-mark">
    <a href="#top" aria-label="Back to the beginning">AB</a>
  </header>

  <main id="top" class="portfolio" aria-label="Modelling portfolio">
    <div id="portfolio-root"></div>
  </main>

  <div class="viewer" aria-hidden="true">
    <div class="viewer__backdrop"></div>

    <div class="viewer__stage">
      <img class="viewer__image" src="" alt="" />

      <button class="viewer__zone viewer__zone--left" aria-label="Previous image"></button>
      <button class="viewer__zone viewer__zone--centre" aria-label="Close image"></button>
      <button class="viewer__zone viewer__zone--right" aria-label="Next image"></button>
    </div>

    <div class="viewer__counter" aria-live="polite"></div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/lightbox.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
