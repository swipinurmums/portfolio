<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Aron Belle modelling portfolio" />
  <meta name="theme-color" content="#f3f1ec" />

  <meta property="og:title" content="Aron Belle" />
  <meta property="og:description" content="Modelling portfolio" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="assets/social-preview/aron-belle-preview.webp" />
  <meta name="twitter:card" content="summary_large_image" />

  <title>Aron Belle</title>

  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/layouts.css" />
  <link rel="stylesheet" href="css/animations.css" />
</head>
<body>
  <div class="loader" aria-hidden="true">
    <span>ARON BELLE</span>
  </div>

  <div class="grain" aria-hidden="true"></div>

  <header class="site-mark">
    <a href="#top" aria-label="Return to the beginning">AB</a>
  </header>

  <main id="top">
    <div id="portfolio"></div>
  </main>

  <div class="viewer" aria-hidden="true">
    <div class="viewer__backdrop"></div>
    <div class="viewer__stage">
      <img class="viewer__image" src="" alt="" />
      <button class="viewer__zone viewer__zone--previous" aria-label="Previous image"></button>
      <button class="viewer__zone viewer__zone--close" aria-label="Close image"></button>
      <button class="viewer__zone viewer__zone--next" aria-label="Next image"></button>
    </div>
    <div class="viewer__counter" aria-live="polite"></div>
  </div>

  <script src="js/viewer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
