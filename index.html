<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Aron Belle modelling portfolio" />
  <meta name="theme-color" content="#f3f1ec" />

  <meta property="og:title" content="Aron Belle" />
  <meta property="og:description" content="Modelling portfolio" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://swipinurmums.github.io/Portfolio/" />
  <meta property="og:image" content="https://swipinurmums.github.io/Portfolio/assets/social-preview/aron-belle-preview.webp" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Aron Belle modelling portfolio" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Aron Belle" />
  <meta name="twitter:description" content="Modelling portfolio" />
  <meta name="twitter:image" content="https://swipinurmums.github.io/Portfolio/assets/social-preview/aron-belle-preview.webp" />

  <title>Aron Belle</title>

  <link rel="stylesheet" href="css/styles.css?v=12" />
  <link rel="stylesheet" href="css/layouts.css?v=12" />
  <link rel="stylesheet" href="css/animations.css?v=12" />
</head>
<body>
  <div class="loader" aria-hidden="true">
    <span class="loader-word" aria-label="Aron Belle">
      <span style="--letter-index: 0">A</span>
      <span style="--letter-index: 1">R</span>
      <span style="--letter-index: 2">O</span>
      <span style="--letter-index: 3">N</span>
      <span class="loader-space" style="--letter-index: 4">&nbsp;</span>
      <span style="--letter-index: 5">B</span>
      <span style="--letter-index: 6">E</span>
      <span style="--letter-index: 7">L</span>
      <span style="--letter-index: 8">L</span>
      <span style="--letter-index: 9">E</span>
    </span>
  </div>

  <div class="grain" aria-hidden="true"></div>
  <div class="desktop-cursor" aria-hidden="true">
    <span>VIEW</span>
  </div>

  <main id="top">
    <div id="portfolio"></div>
  </main>

  <div class="viewer" aria-hidden="true">
    <div class="viewer__backdrop"></div>
    <div class="viewer__stage">
      <img class="viewer__image" src="" alt="" />
      <button class="viewer__zone viewer__zone--previous" aria-label="Previous image"></button>
      <button class="viewer__zone viewer__zone--close" aria-label="Close image"></button>
      <button class="viewer__zone viewer__zone--next" aria-label="Next image"></button>
    </div>
    <div class="viewer__counter" aria-live="polite"></div>
  </div>

  <script src="js/viewer.js?v=6"></script>
  <script src="js/app.js?v=6"></script>
</body>
</html>
